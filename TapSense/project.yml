name: TapSense
options:
  bundleIdPrefix: com.tapsense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NFCLocatorCore:
    path: ..

targets:
  TapSense:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: NFCLocatorCore
        product: NFCLocatorCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TapSense
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NFCReaderUsageDescription: "TapSense uses NFC to detect when your phone successfully taps an NFC tag or reader, so it can confirm your recommended tap area is working."
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Manrope-Variable.ttf
          - Inter-Variable.ttf
    entitlements:
      path: Generated/TapSense.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapsense.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Core NFC (Tap Test) only works on a physical device, which needs its own Development
        # Team for the NFC entitlement to actually be provisioned — see TapSense/README.md.
        # `${DEVELOPMENT_TEAM}` is expanded by `xcodegen generate` from the shell environment,
        # so `export DEVELOPMENT_TEAM=<your team ID>` before generating survives regeneration —
        # picking a team purely through Xcode's Signing & Capabilities UI does not, since
        # `xcodegen generate` rewrites the whole .xcodeproj on every run.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

  TapSenseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TapSense
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: true

schemes:
  TapSense:
    build:
      targets:
        TapSense: all
        TapSenseTests: [test]
    test:
      targets:
        - TapSenseTests
    run:
      config: Debug
